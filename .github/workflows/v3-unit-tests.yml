name: v3-unit-tests
env:
  # raise that threshold over time
  COVERAGE_THRESHOLD: 25
on:
  push:
    branches: [main, staging]
    paths:
      - 'v3/**'
      - '.github/workflows/v3-unit-tests.yml'
  pull_request:
    paths:
      - 'v3/**'
      - '.github/workflows/v3-unit-tests.yml'
  workflow_dispatch:
jobs:
  v3-unit-tests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: './v3/go.mod'
          cache-dependency-path: go.sum
      - uses: bufbuild/buf-setup-action@v1.50.0
      - run: make v3-generate-static-files
      - name: unit tests
        run: |
          export TERM=xterm
          go test -C v3 $(go list -C v3 ./... | grep -Ev "test|cmd|domain/gen|internal/log|api/external|api/inhouse") -coverprofile=coverage.out -covermode=atomic -race

      - name: coverage
        run: |
          echo "Quality Gate: checking test coverage is above threshold ..."
          echo "Threshold             : $COVERAGE_THRESHOLD %"
          totalCoverage=`cat v3/coverage.out | grep -v 'mock' > coverage_no_mock.out && go tool cover -func=coverage_no_mock.out | grep ^total | grep -Eo '[0-9]+\.[0-9]+'`
          echo "Current test coverage : $totalCoverage %"
          if (( $(echo "$totalCoverage $COVERAGE_THRESHOLD" | awk '{print ($1 >= $2)}') )); then
              echo "OK"
          else
              echo "Current test coverage is below threshold. Please add more unit tests."
              echo "Failed"
              exit 1
          fi
