name: v2-backend-unit-tests
env:
  # raise that threshold over time
  COVERAGE_THRESHOLD: 2
on:
  push:
    branches: [main, staging]
    paths:
      - 'v2/backend/**'
      - '.github/workflows/v2-backend-unit-tests.yml'
  pull_request:
    paths:
      - 'v2/backend/**'
      - '.github/workflows/v2-backend-unit-tests.yml'
  workflow_dispatch:
jobs:
  v2-backend-unit-tests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: './v2/backend/go.mod'
          cache-dependency-path: go.sum
      - name: unit tests
        run: |
          export TERM=xterm
          go test -C v2/backend `go list -C v2/backend ./... | grep -v "pkg/consapi\|internal/th\|internal/contracts\|pkg/commons/types\|pkg/commons/contracts\|cmd\|db2"` -coverprofile coverage.out -covermode atomic -race

      - name: coverage
        run: |
          echo "Quality Gate: checking test coverage is above threshold ..."
          echo "Threshold             : $COVERAGE_THRESHOLD %"
          totalCoverage=`cat v2/backend/coverage.out | grep -v 'mock' > coverage_no_mock.out && go tool cover -func=coverage_no_mock.out | grep ^total | grep -Eo '[0-9]+\.[0-9]+'`
          echo "Current test coverage : $totalCoverage %"
          if (( $(echo "$totalCoverage $COVERAGE_THRESHOLD" | awk '{print ($1 >= $2)}') )); then
              echo "OK"
          else
              echo "Current test coverage is below threshold. Please add more unit tests."
              echo "Failed"
              exit 1
          fi
