name: Unit-Tests

env:
  # raise that threshold over time
  COVERAGE_THRESHOLD: 34

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: './go.mod'
          cache-dependency-path: go.sum
      - uses: bufbuild/buf-setup-action@v1.50.0
      - run: make generate-proto
      - name: unit tests
        run: |
          export TERM=xterm
          go test $(go list ./... | grep -Ev "test|cmd|api/gen|domain/gen")  -coverprofile=coverage.out -covermode=atomic -race

      - name: coverage
        run: |
          echo "Quality Gate: checking test coverage is above threshold ..."
          echo "Threshold             : $COVERAGE_THRESHOLD %"
          totalCoverage=`go tool cover -func=coverage.out | grep ^total | grep -Eo '[0-9]+\.[0-9]+'`
          echo "Current test coverage : $totalCoverage %"
          if (( $(echo "$totalCoverage $COVERAGE_THRESHOLD" | awk '{print ($1 >= $2)}') )); then
              echo "OK"
          else
              echo "Current test coverage is below threshold. Please add more unit tests."
              echo "Failed"
              exit 1
          fi
