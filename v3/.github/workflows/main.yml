name: Run Integration Tests (Matrix)

on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        network: [mainnet-staging, gnosis-staging, mainnet-beta, gnosis-beta]
        testType: [smoke, e2e, v2-beta-mainnet, v2-beta-gnosis]

    env:
      API_KEY_ORCA_TEST: ${{ secrets.API_KEY_ORCA_TEST }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Set ENV_FILE for CI
        run: echo "ENV_FILE=test/testEnv/.env.${{ matrix.network }}" >> $GITHUB_ENV

      - name: Install test tools
        run: go install gotest.tools/gotestsum@latest

      - name: Set TAGS for test run
        run: |
          echo "TAGS=${{ matrix.testType }}" >> $GITHUB_ENV

      - name: Run integration tests
        run: |
          gotestsum --format testname --junitfile report.xml -- \
            -count=1 -tags="${TAGS// /,}" ./test

      - name: Generate HTML report
        run: |
          pip3 install junit2html
          junit2html report.xml report.html

      - uses: actions/upload-artifact@v4
        with:
          name: junit-report-${{ matrix.network }}-${{ matrix.testType }}
          path: |
            report.xml
            report.html

      - name: Generate HTML report from JUnit
        if: always()
        uses: mikepenz/action-junit-report@v3
        with:
          report_paths: 'report.xml'
          check_name: 'Integration Test Report'
          detailed_summary: true
          include_passed: true
