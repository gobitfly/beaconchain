version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/gobitfly/beaconchain-api/model
  # Remove `disable` field if googleapis is not used
  disable:
    - module: buf.build/googleapis/googleapis
      file_option: go_package_prefix
    - module: buf.build/grpc-ecosystem/grpc-gateway
      file_option: go_package_prefix
    # Don't modify any file option or field option for protovalidate. Without
    # this, generated Go will fail to compile.
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate

plugins:
  - remote: buf.build/protocolbuffers/go
    out: api/gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: api/gen
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway
    out: api/gen
    opt: 
      - paths=source_relative
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.20.0
    out: api/gen
inputs:
  - directory: api/protos
