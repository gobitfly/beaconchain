          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.ApiResponse'
  /api/v1/validators/proposalLuck:
    get:
      tags:
        - Validators
      summary: Get validator proposal luck
      description: Returns the proposal luck of a validator or a list of validators
      parameters:
        - name: validators
          in: query
          description: Provide a comma separated list of validator indices or pubkeys
          required: true
          style: form
          explode: true
          schema: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/types.ApiResponse'
                  - properties:
                      data:
                        items:
                          $ref: '#/components/schemas/types.ApiProposalLuckResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.ApiResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.ApiResponse'
  /api/v1/validators/queue:
    get:
      tags:
        - Validators
      summary: Get validator queue
      description: Returns the current number of validators entering and exiting the
        beacon chain
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/types.ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/types.ApiValidatorQueueResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/types.ApiResponse'
