                grant_type:
                  description: grant_type use authorization_code for oauth code or
                    refresh_token if you wish to refresh an token
                code:
                  description: Only required when using authorization_code grant type.
                    Code received via oauth redirect_uri
                redirect_uri:
                  description: Only required when using authorization_code grant type.
                    Must match the redirect_uri from your oauth flow.
                refresh_token:
                  description: Only required when using refresh_token grant type.
                    The refresh_token you received during authorization_code flow.
