components:
  # responses:
  # headers:
  # examples:
  # links:
  # callbacks:
  parameters:
    slot:
      name: slot
      in: path
      required: true
      schema:
        oneOf:
          - type: integer
            minimum: 0
          - type: string
            enum:
              - latest
          - $ref: '#/components/schemas/ConsensusLayerBlockRoot'
        default: latest

    block:
      name: block
      in: path
      required: true
      schema:
        oneOf:
          - type: integer
            format: int64
            minimum: 0
          - type: string
            enum:
              - latest
          - $ref: '#/components/schemas/ExecutionLayerBlockHash'
        default: latest

    epochQuery:
      name: epoch
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/epochParam'

    epochPath:
      name: epoch
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/epochParam'

    chain:
      name: chain
      in: query
      required: true
      schema:
        type: string
        enum:
          - mainnet
          - hoodi
          - sepolia
        default: mainnet

    cursor:
      name: cursor
      in: query
      required: false
      description: Cursor for pagination
      schema:
        type: string

    pageSize:
      name: page_size
      in: query
      required: false
      description: Number of results to return
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

    # depositAddress, withdrawalAddress and validator are the "validator selector", they're mutually exclusive
    # see confluence HLD for details
    # TODO implement like time selector
    depositAddress:
      name: deposit_address
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ExecutionLayerAddress'

    withdrawalAddress:
      name: withdrawal_address
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ExecutionLayerAddress'

    validator:
      name: validator_identifier
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/validatorIndexPubkey'

    startTs:
      name: start_time
      in: query
      required: false
      description: Start of the time range (inclusive)
      schema:
        $ref: '#/components/schemas/timestamp'

    endTs:
      name: end_time
      in: query
      required: false
      description: End of the time range (inclusive)
      schema:
        $ref: '#/components/schemas/timestamp'

    startEpoch:
      name: start_epoch
      in: query
      required: false
      description: Start of the time range (inclusive)
      schema:
        $ref: '#/components/schemas/epochParam'

    endEpoch:
      name: end_epoch
      in: query
      required: false
      description: End of the time range (inclusive)
      schema:
        $ref: '#/components/schemas/slotParam'

    startSlot:
      name: start_slot
      in: query
      required: false
      description: Start of the time range (inclusive)
      schema:
        $ref: '#/components/schemas/slotParam'

    endSlot:
      name: end_slot
      in: query
      required: false
      description: End of the time range (inclusive)
      schema:
        $ref: '#/components/schemas/slotParam'

  requestBodies:
    validatorsSelector:
      description: Request body to filter validators
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidatorsByDeposit'
              - $ref: '#/components/schemas/ValidatorsByWithdrawal'
              - $ref: '#/components/schemas/ValidatorsByList'

  schemas:
    clQueues:
      type: object
      properties:
        execution_layer_queued:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        execution_layer_processed:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        consensus_layer_queued:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          x-sortable: true
        consensus_layer_processed:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          x-sortable: true

    timestamp:
      type: integer
      format: int64
      minimum: 0

    wei:
      type: string
      pattern: ^(0|-?[1-9][0-9]*)$

    validator:
      type: object
      properties:
        index:
          allOf:
            - $ref: '#/components/schemas/validatorIndex'
          nullable: true
        pubkey:
          $ref: '#/components/schemas/validatorPubkey'

    validatorPubkey:
      type: string
      pattern: ^0x[a-fA-F0-9]{96}$

    validatorIndex:
      type: integer
      format: int32
      minimum: 0

    count:
      type: integer
      format: int32
      minimum: 0

    ValidatorsByDeposit:
      type: object
      properties:
        deposit_address:
          $ref: '#/components/schemas/ExecutionLayerAddress'
      required: [deposit_address]

    ValidatorsByWithdrawal:
      type: object
      properties:
        withdrawal_address:
          $ref: '#/components/schemas/ExecutionLayerAddress'
      required: [withdrawal_address]

    ValidatorsByList:
      type: object
      properties:
        validator_identifiers:
          $ref: '#/components/schemas/validatorIndexPubkeys'
      required: [validators]

    epochParam:
      oneOf:
        - type: integer
          format: int32
          minimum: 0
        - type: string
          enum:
            - latest
      default: latest

    slotParam:
      oneOf:
        - type: integer
          format: int32
          minimum: 0
        - type: string
          enum:
            - latest
      default: latest

    durationParam:
      type: object
      properties:
        hours:
          type: integer
          minimum: 1
        days:
          type: integer
          minimum: 1
        weeks:
          type: integer
          minimum: 1
        months:
          type: integer
          minimum: 1
      additionalProperties: false
      oneOf:
        - required: [hours]
        - required: [days]
        - required: [weeks]
        - required: [months]
      default:
        days: 1

    transactionHash:
      type: string
      pattern: ^0x[a-fA-F0-9]{64}$

    ExecutionLayerAddress:
      type: string
      pattern: ^0x[a-fA-F0-9]{40}$

    ConsensusLayerBlockRoot:
      type: string
      pattern: ^0x[a-fA-F0-9]{64}$

    ExecutionLayerBlockHash:
      type: string
      pattern: ^0x[a-fA-F0-9]{64}$

