openapi: 3.0.4
info:
  title: External Service API
  version: 1.0.3

servers:
  - url: https://api-external-616724563735.us-central1.run.app
    description: Staging
  - url: http://localhost:8080
    description: Local development

security:
  - ApiKeyAuth: []
  - GCPAuth: []

paths:
  /v2/ethereum/validators:
    post:
      tags:
        - Validator
      summary: Returns basic information of a validator
      requestBody:
        $ref: '#/components/requestBodies/validatorsSelector'
      parameters:
        - $ref: '#/components/parameters/chain'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/pageSize'
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetValidatorMetadataResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'

  /v2/ethereum/validators/apr:
    get:
      tags:
        - Validator
      summary: Returns the APR for a set of validators.
      description: Must provide either start + end times or epochs. Must provide one of deposit_address, withdrawal_address or validator.
      parameters:
        - $ref: '#/components/parameters/chain'
        - $ref: '#/components/parameters/depositAddress'
        - $ref: '#/components/parameters/withdrawalAddress'
        - $ref: '#/components/parameters/validator'
        - $ref: '#/components/parameters/startTs'
        - $ref: '#/components/parameters/endTs'
        - $ref: '#/components/parameters/startEpoch'
        - $ref: '#/components/parameters/endEpoch'
        - name: calculation_period
          in: query
          required: true
          schema:
            type: string
            enum: ["backwards", "forwards"]
            default: backwards
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetValidatorAprResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'

  /v2/ethereum/validators/rewards-summary:
    get:
      tags:
        - Validator
      summary: Returns the cumulative rewards for a set of validators.
      description: Must provide either start + end times or epochs. Must provide one of deposit_address, withdrawal_address or validator.
      parameters:
        - $ref: '#/components/parameters/chain'
        - $ref: '#/components/parameters/depositAddress'
        - $ref: '#/components/parameters/withdrawalAddress'
        - $ref: '#/components/parameters/validator'
        - $ref: '#/components/parameters/startTs'
        - $ref: '#/components/parameters/endTs'
        - $ref: '#/components/parameters/startEpoch'
        - $ref: '#/components/parameters/endEpoch'
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetValidatorRewardsSummaryResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'

  /v2/ethereum/validators/rewards-detailed:
    post:
      tags:
        - Validator
      summary: Returns a detailed description of the rewards
      requestBody:
        $ref: '#/components/requestBodies/validatorsSelector'
      parameters:
        - $ref: '#/components/parameters/chain'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/epochQuery'
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetValidatorRewardsDetailedResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'

  /v2/ethereum/validators/performance-summary:
    get:
      tags:
        - Validator
      summary: Returns the beaconscore of a set of validators.
      description: Must provide either start + end times or epochs. Must provide one of deposit_address, withdrawal_address or validator.
      parameters:
        - $ref: '#/components/parameters/chain'
        - $ref: '#/components/parameters/depositAddress'
        - $ref: '#/components/parameters/withdrawalAddress'
        - $ref: '#/components/parameters/validator'
        - $ref: '#/components/parameters/startTs'
        - $ref: '#/components/parameters/endTs'
        - $ref: '#/components/parameters/startEpoch'
        - $ref: '#/components/parameters/endEpoch'
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetValidatorPerformanceSummaryResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpc.Status'

  /v2/ethereum/validators/performance-detailed:
    post:
      tags:
        - Validator
      summary: Returns a detailed description of a validators performance for a specific epoch for a set of validators
      requestBody:
        $ref: '#/components/requestBodies/validatorsSelector'
      parameters:
