      properties:
        attestations:
          $ref: '#/components/schemas/attestationRewards'
        sync_participations:
          $ref: '#/components/schemas/rewardBreakdown'
        proposals:
          $ref: '#/components/schemas/proposalRewards'
        start_epoch:
          type: integer
          format: int64
          minimum: 0
        end_epoch:
          type: integer
          format: int64
          minimum: 0

    GetValidatorSyncCommitteesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
              additionalProperties:
                type: boolean
          example:
            - 8192: { 0: true, 100: false, 2000: true }
            - 8193: { 0: true, 100: false, 2000: false }
            - ...
        paging:
          $ref: '#/components/schemas/Paging'
      description: A Response containing detailed sync committee information of the validators.

    GetValidatorWithdrawalsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GetValidatorWithdrawalsResponse.Data'
        paging:
          $ref: '#/components/schemas/Paging'
      description: A Response containing detailed withdrawal information of the validators.

    GetValidatorWithdrawalsResponse.Data:
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/wei'
        validator:
          $ref: '#/components/schemas/validator'
        reject_reason:
          allOf:
            - $ref: '#/components/schemas/GetValidatorWithdrawalsResponse.RejectReason'
          nullable: true
        status:
          allOf:
            - $ref: '#/components/schemas/ConsensusLayerEventStatus'
          nullable: true
        type:
          allOf:
            - $ref: '#/components/schemas/GetValidatorWithdrawalsResponse.Type'
          nullable: true
        queues:
          $ref: '#/components/schemas/clQueues'
        withdrawal_credentials:
          type: string
          format: byte
        recipient:
          type: string
          format: byte
          nullable: true
        request:
          type: object
          nullable: true
          properties:
            tx_hash:
              $ref: '#/components/schemas/transactionHash'
            tx_sender:
              $ref: '#/components/schemas/ExecutionLayerAddressDetails'
            withdrawer:
              $ref: '#/components/schemas/ExecutionLayerAddressDetails'
            fee:
              $ref: '#/components/schemas/wei'
        data_references:
          $ref: '#/components/schemas/DataRecency'

    GetValidatorWithdrawalsResponse.RejectReason:
      type: string
      enum:
        - full_queue
        - unknown_pubkey
        - no_execution_withdrawal_credentials
        - address_mismatch
        - inactive
        - exiting
        - too_young
        - pending_withdrawals
        - not_compounding
        - insufficient_effective_balance
        - excess_balance

    GetValidatorWithdrawalsResponse.Type:
      type: string
      enum:
        - manual
        - network
        - skimming

    Paging:
      type: object
      properties:
        next_cursor:
          type: string

    DepositValidity:
      type: string
      enum:
        - valid
        - invalid
        - invalid_skipped

    FinalityDetailed:
      type: object
      properties:
        head:
          type: object
          properties:
            epoch:
              type: integer
              format: int32
              minimum: 0
            slot:
              type: integer
              format: int32
              minimum: 0
        justified:
          type: object
          properties:
            epoch:
              type: integer
              format: int32
              minimum: 0
            slot:
              type: integer
              format: int32
              minimum: 0
        finalized:
          type: object
          properties:
            epoch:
              type: integer
              format: int32
              minimum: 0
            slot:
              type: integer
              format: int32
              minimum: 0

    DataRecency:
      type: string
      enum:
        - unjustified
        - justified
        - finalized

    Withdrawals:
      type: object
      properties:
        next_withdrawal_index:
          type: integer
          format: int64
        validator:
          $ref: '#/components/schemas/validator'
        recipient:
          $ref: '#/components/schemas/ExecutionLayerAddressDetails'
        amount:
          $ref: '#/components/schemas/wei'
        fee:
          allOf:
            - $ref: '#/components/schemas/wei'
          nullable: true
        status:
          $ref: '#/components/schemas/ConsensusLayerEventStatus'
        is_processed:
          type: boolean
        queues:
          $ref: '#/components/schemas/clQueues'
        data_references:
          $ref: '#/components/schemas/DataRecency'

    rpc.Status:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string

  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: 'Authorization header with value: Bearer <token>'

    GCPAuth:
      type: apiKey
      description: 'Authorization header with value: Bearer <token>'
      name: X-Serverless-Authorization
      in: header
